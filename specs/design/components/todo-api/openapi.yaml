openapi: 3.0.3
info:
  title: Todo API
  version: 0.1.0
  description: REST API for the single shared todo list.
servers:
  - url: /
paths:
  /todos:
    get:
      operationId: listTodos
      summary: List all todos
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: A page of todos
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Todo' }
    post:
      operationId: createTodo
      summary: Add a new todo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewTodo' }
      responses:
        '201':
          description: The created todo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        '400':
          description: The title is missing or empty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /todos/{todoId}:
    parameters:
      - name: todoId
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: updateTodo
      summary: Change a todo's title and/or completed flag
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTodo' }
      responses:
        '200':
          description: The updated todo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        '400':
          description: The title is empty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No todo with that id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteTodo
      summary: Delete a todo
      responses:
        '204':
          description: Deleted
        '404':
          description: No todo with that id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  schemas:
    Todo:
      type: object
      required: [id, title, completed]
      properties:
        id: { type: string }
        title: { type: string }
        completed: { type: boolean }
    NewTodo:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
    UpdateTodo:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        completed: { type: boolean }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
